name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build SPA
        working-directory: src/ConfigWay.UI/SPA
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          dotnet build src/ConfigWay.Core/ConfigWay.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/ConfigWay/ConfigWay.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/ConfigWay.UI/ConfigWay.UI.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/ConfigWay.PostgreSQL/ConfigWay.PostgreSQL.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/ConfigWay.SqlServer/ConfigWay.SqlServer.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/ConfigWay.FeatureManagement/ConfigWay.FeatureManagement.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/ConfigWay.Core/ConfigWay.Core.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/ConfigWay/ConfigWay.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/ConfigWay.UI/ConfigWay.UI.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/ConfigWay.PostgreSQL/ConfigWay.PostgreSQL.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/ConfigWay.SqlServer/ConfigWay.SqlServer.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/ConfigWay.FeatureManagement/ConfigWay.FeatureManagement.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
